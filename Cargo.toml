[package]
name = "axum_todo"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
  "migration",
]

[dependencies]
axum = "0.8.9"
bcrypt = "0.19.3"
dotenvy = "0.15.7"
jsonwebtoken = {
  version = "11.0.0",
  default-features = false,
  features = ["rust_crypto"]
}
migration = { path = "migration" }
sea-orm = {
  version = "2.0.0",
  features = ["macros", "runtime-tokio-rustls", "sqlx-postgres"]
}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
