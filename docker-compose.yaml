services:
  redis:
    image: redis/redis-stack:latest
    container_name: todo-axum-redis
    ports:
      - "6379:6379"
      - "4000:8001"
    volumes:
      - todo_axum_redis_data:/data
    restart: always
    networks:
      - todo_axum_default

  postgress_db:
    image: postgres:16-alpine
    container_name: todo-axum-database
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo_axum
    volumes:
      - todo_axum_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - todo_axum_default

volumes:
  todo_axum_postgres_data:
  todo_axum_redis_data:

networks:
  todo_axum_default:
    driver: bridge
